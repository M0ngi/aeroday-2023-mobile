name: Build on Tag Update

on:
  push:
    tags:
      - '*'

jobs:
  build_android_production:
    type: build
    params:
      platform: android
      profile: production

  submit_android_production:
    needs: [build_android_production]
    type: submit
    params:
      platform: android
      profile: production
      build_id: ${{ needs.build_android_production.outputs.build_id }}
